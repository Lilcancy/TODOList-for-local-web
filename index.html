<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日待办</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="today">
      <div class="today__readout">
        <p class="today__date" id="date"></p>
        <p class="today__time" id="clock"></p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色主题">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </header>

    <form class="compose" id="compose" autocomplete="off">
      <input class="compose__input" id="task-input" type="text" placeholder="今天要做什么？" aria-label="新任务" maxlength="200">
      <button class="compose__add" type="submit">添加</button>
    </form>

    <div class="toolbar">
      <nav class="filters" aria-label="筛选任务">
        <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter" type="button" data-filter="done" aria-pressed="false">已完成</button>
      </nav>
      <button class="toolbar__clear" id="clear-done" type="button" hidden>清除已完成</button>
    </div>

    <ul class="tasks" id="tasks"></ul>

    <footer class="status">
      <p class="status__count" id="count"></p>
    </footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
